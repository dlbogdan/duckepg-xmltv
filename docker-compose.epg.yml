services:
  epg2xmltv:
    build:
      context: .
    # Bump the default tag when deployment code changes so Portainer cannot
    # silently reuse a stale locally built image during a Git redeploy.
    image: ${EPG_IMAGE:-epg2xmltv:0.1.3}
    container_name: epg2xmltv
    restart: unless-stopped
    ports:
      - "${EPG_HTTP_PORT:-8080}:8080"
    environment:
      TUNER_IP: ${TUNER_IP:-10.9.2.132}
      TZ: ${TZ:-Europe/Bucharest}
      SCHEDULE: ${EPG_SCHEDULE:-03:00}
      SEED_FREQUENCY: ${SEED_FREQUENCY:-706000000}
      # One daily capture of the persisted guide-bearing mux, not per discovered mux.
      CAPTURE_SECONDS: ${CAPTURE_SECONDS:-90}
      HTTP_PORT: 8080
    volumes:
      - epg2xmltv_data:/data

volumes:
  epg2xmltv_data:
    name: epg2xmltv_data
