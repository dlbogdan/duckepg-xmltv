services:
  epg2xmltv:
    build:
      context: .
    container_name: epg2xmltv
    # HDHomeRun sends the MPEG-TS back over UDP to the requesting host. Bridge
    # NAT advertises an address the physical tuner cannot reach, so use the
    # Portainer host network for capture traffic.
    network_mode: host
    restart: unless-stopped
    environment:
      TUNER_IP: ${TUNER_IP:-10.9.2.132}
      TZ: ${TZ:-Europe/Bucharest}
      SCHEDULE: ${EPG_SCHEDULE:-06:00,14:00}
      SEED_FREQUENCY: ${SEED_FREQUENCY:-706000000}
      # One daily capture of the persisted guide-bearing mux, not per discovered mux.
      CAPTURE_SECONDS: ${CAPTURE_SECONDS:-90}
      EIT_CAPTURE_SECONDS: ${EIT_CAPTURE_SECONDS:-15}
      HTTP_PORT: 8080
      # Automatic Romanian channel-logo matching; images are cached in /data.
      LOGOS_ENABLED: ${LOGOS_ENABLED:-true}
      # Only these image hosts may be downloaded. Add a host here before using
      # it in a remote manual override.
      LOGO_ALLOWED_HOSTS: ${LOGO_ALLOWED_HOSTS:-i.imgur.com,upload.wikimedia.org}
    volumes:
      - epg2xmltv_data:/data

volumes:
  epg2xmltv_data:
    name: epg2xmltv_data
